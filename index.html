<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Náš spoločný čas ♡ — Mgr. Peter Galko</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --pink: #ff6f9f;
      --pink2: #ffb6cc;
      --cream: #fff8fb;
      --ink: #49343d;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fff9fc, #fff0f5 55%, #fff8fb);
      overflow-x: hidden;
    }

    .app { max-width: 1100px; position: relative; }

    .glass {
      background: rgba(255, 255, 255, .85);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 18px 50px rgba(180, 70, 105, .12);
      border-radius: 28px;
    }

    .hero { padding: 34px; }
    .heart { font-size: 52px; display: inline-block; }

    .title { font-weight: 800; letter-spacing: -1px; }
    .subtitle { opacity: .7; }

    .stat {
      border-radius: 22px;
      background: rgba(255, 255, 255, .9);
      padding: 20px 10px;
      box-shadow: 0 8px 25px rgba(180, 70, 105, .08);
      height: 100%;
    }

    .stat .num {
      font-size: 36px;
      font-weight: 800;
      color: var(--pink);
    }

    .stat .label {
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      opacity: .65;
    }

    .calendar { padding: 25px; }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .month-title {
      font-weight: 800;
      font-size: 1.5rem;
      text-align: center;
      text-transform: capitalize;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      width: 100%;
    }

    .weekday {
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .78rem;
      font-weight: 700;
      opacity: .55;
    }

    .day {
      width: 100%;
      min-height: 60px;
      border-radius: 14px;
      cursor: pointer;
      background: rgba(255, 255, 255, .6);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 3px;
    }

    .day.muted { opacity: .25; }
    .day.today { border-color: var(--pink); font-weight: bold; }
    .day.anniv { background: #ffe2ec; border-color: var(--pink2); }

    .day .heart-mini { font-size: 12px; }
    .day .date-num { font-weight: 700; font-size: 0.95rem; }

    .legend { font-size: .82rem; opacity: .65; }

    .toast-love {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1000;
      display: none;
    }

    @media (max-width: 576px) {
      .hero { padding: 20px 14px; }
      .calendar { padding: 14px; }
      .calendar-grid { gap: 3px; }
      .day { min-height: 50px; border-radius: 10px; }
      .weekday { font-size: .65rem; height: 28px; }
      .stat .num { font-size: 28px; }
    }
  </style>
</head>

<body>

  <div class="container app py-4 py-md-5">

    <section class="glass hero mb-4 text-center">
      <div class="heart">♡</div>
      <h1 class="title display-5 mt-2 mb-2">Náš spoločný čas</h1>
      <p class="subtitle mb-4">Každý deň je ďalší malý kúsok nášho príbehu.</p>

      <div class="row g-3">
        <div class="col-4">
          <div class="stat">
            <div class="num" id="days">...</div>
            <div class="label">dní</div>
          </div>
        </div>

        <div class="col-4">
          <div class="stat">
            <div class="num" id="months">...</div>
            <div class="label">mesiacov</div>
          </div>
        </div>

        <div class="col-4">
          <div class="stat">
            <div class="num" id="years">...</div>
            <div class="label">rokov</div>
          </div>
        </div>
      </div>

      <p class="mt-4 mb-1 fw-semibold">
        Spolu od <span id="sinceText">...</span> • dnes <span id="todayText">...</span>
      </p>
    </section>

    <section class="glass calendar mb-4">
      <div class="calendar-head">
        <button class="btn btn-light rounded-4" id="prev" type="button">‹</button>
        <div class="month-title" id="monthTitle">...</div>
        <button class="btn btn-light rounded-4" id="next" type="button">›</button>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="legend mt-3 text-center">
        ♡ označuje váš výnimočný deň • obrys označuje dnešok
      </div>
    </section>

    <section class="glass p-4 text-center">
      <h5 class="fw-bold mb-2">Náš začiatok 💗</h5>
      <div class="fs-4 fw-bold" style="color:var(--pink)">24. 11. 2024</div>
    </section>

  </div>

  <div class="toast-love" id="loveToast">
    <div class="toast show align-items-center border-0 shadow">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg"></div>
      </div>
    </div>
  </div>

  <footer class="text-center small opacity-50 py-4">
    Vytvoril: Mgr. Peter Galko
  </footer>

  <!-- SKRIPT JE NA KONCI A SPÚŠŤA SA OKAMŽITE -->
  <script>
    var skMonths = [
      "január", "február", "marec", "apríl", "máj", "jún",
      "júl", "august", "september", "október", "november", "december"
    ];

    var skWeek = ["Po", "Ut", "St", "Št", "Pi", "So", "Ne"];

    var start = new Date(2024, 10, 24);
    var view = new Date();

    function pad(n) {
      return (n < 10 ? '0' : '') + n;
    }

    function fmt(d) {
      return pad(d.getDate()) + ". " + skMonths[d.getMonth()] + " " + d.getFullYear();
    }

    function daysBetween(a, b) {
      var oneDay = 1000 * 60 * 60 * 24;
      return Math.round((b.getTime() - a.getTime()) / oneDay);
    }

    function updateStats() {
      var today = new Date();
      var todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      var startMidnight = new Date(start.getFullYear(), start.getMonth(), start.getDate());

      var days = daysBetween(startMidnight, todayMidnight);
      
      var y = todayMidnight.getFullYear() - startMidnight.getFullYear();
      var m = todayMidnight.getMonth() - startMidnight.getMonth();
      if (m < 0) {
        y--;
        m += 12;
      }

      var elDays = document.getElementById("days");
      var elMonths = document.getElementById("months");
      var elYears = document.getElementById("years");
      var elSince = document.getElementById("sinceText");
      var elToday = document.getElementById("todayText");

      if (elDays) elDays.textContent = days;
      if (elMonths) elMonths.textContent = (y * 12 + m);
      if (elYears) elYears.textContent = y;
      if (elSince) elSince.textContent = fmt(startMidnight);
      if (elToday) elToday.textContent = fmt(todayMidnight);
    }

    function renderCalendar() {
      var grid = document.getElementById("calendarGrid");
      if (!grid) return;
      grid.innerHTML = "";

      for (var w = 0; w < skWeek.length; w++) {
        var wEl = document.createElement("div");
        wEl.className = "weekday";
        wEl.textContent = skWeek[w];
        grid.appendChild(wEl);
      }

      var elMonthTitle = document.getElementById("monthTitle");
      if (elMonthTitle) {
        elMonthTitle.textContent = skMonths[view.getMonth()] + " " + view.getFullYear();
      }

      var first = new Date(view.getFullYear(), view.getMonth(), 1);
      var offset = (first.getDay() + 6) % 7;
      var daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      var prevDays = new Date(view.getFullYear(), view.getMonth(), 0).getDate();
      var total = Math.ceil((offset + daysInMonth) / 7) * 7;

      var today = new Date();
      var todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      for (var i = 0; i < total; i++) {
        var num = i - offset + 1;
        var d, muted = false;

        if (num < 1) {
          d = new Date(view.getFullYear(), view.getMonth() - 1, prevDays + num);
          muted = true;
        } else if (num > daysInMonth) {
          d = new Date(view.getFullYear(), view.getMonth() + 1, num - daysInMonth);
          muted = true;
        } else {
          d = new Date(view.getFullYear(), view.getMonth(), num);
        }

        var cell = document.createElement("div");
        cell.className = "day";
        if (muted) cell.className += " muted";

        var dMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate());

        if (dMidnight.getTime() === todayMidnight.getTime()) {
          cell.className += " today";
        }

        if (d.getMonth() === start.getMonth() && d.getDate() === start.getDate()) {
          cell.className += " anniv";
          cell.innerHTML = '<span class="date-num">' + d.getDate() + '</span><span class="heart-mini">♡</span>';
        } else {
          cell.innerHTML = '<span class="date-num">' + d.getDate() + "</span>";
        }

        (function (dateObj) {
          cell.addEventListener("click", function () {
            var clicked = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
            var startM = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            var diff = daysBetween(startM, clicked);

            var toast = document.getElementById("loveToast");
            var msg = document.getElementById("toastMsg");

            if (clicked.getTime() < startM.getTime()) {
              msg.textContent = fmt(dateObj) + " — ešte ste spolu neboli ♡";
            } else {
              msg.textContent = fmt(dateObj) + " — váš " + diff + ". deň spolu ♡";
            }

            toast.style.display = "block";
            setTimeout(function () { toast.style.display = "none"; }, 2500);
          });
        })(d);

        grid.appendChild(cell);
      }
    }

    // Priame spustenie bez akéhokoľvek čakania
    updateStats();
    renderCalendar();

    var prevBtn = document.getElementById("prev");
    var nextBtn = document.getElementById("next");

    if (prevBtn) {
      prevBtn.addEventListener("click", function () {
        view.setDate(1);
        view.setMonth(view.getMonth() - 1);
        renderCalendar();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener("click", function () {
        view.setDate(1);
        view.setMonth(view.getMonth() + 1);
        renderCalendar();
      });
    }
  </script>
</body>
</html>
